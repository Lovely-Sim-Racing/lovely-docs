title: TeamLINQ Docs
description: Create your own Dashboards or Applications using TeamLINQ’s SimHub Properties.
theme: just-the-docs
color_scheme: lovely

url: https://docs.lsr.gg/
# baseurl: docs

favicon_ico: "/images/favicon.ico"
nav_enabled: true

aux_links:
  "by Lovely Sim Racing":
    - "https://store.lsr.gg"

aux_links_new_tab: true

callouts:
  highlight:
    title: Did you know?
    color: pink
  important:
    title: Important
    color: yellow
  new:
    title: New
    color: green
  note:
    color: purple
  green:
    color: green
  yellow:
    color: yellow
  red:
    color: red
  warning:
    title: Warning
    color: red

back_to_top: true
back_to_top_text: "Back to top"

# Footer last edited timestamp
last_edit_timestamp: true # show or hide edit time - page must have `last_modified_date` defined in the frontmatter
last_edit_time_format: "%b %e %Y at %I:%M %p" # uses ruby's time format: https://ruby-doc.org/stdlib-2.7.0/libdoc/time/rdoc/Time.html